pretrained_path: ckpt/base_nv/
train_manifest: dataset/train.jsonl
val_manifest: null
sample_rate: 16000        # AudioVAE encoder input rate; must match audio_vae_config.sample_rate
out_sample_rate: 48000    # AudioVAE decoder output rate; used for TensorBoard audio logging
batch_size: 1
grad_accum_steps: 32  # effective batch size = batch_size × grad_accum_steps = 16
num_workers: 0
num_iters: 10000
log_interval: 1
valid_interval: 500
save_interval: 500
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 500
max_steps: 10000
max_batch_tokens: 512
max_grad_norm: 1.0        # gradient clipping max norm; 0 = disabled
save_path: checkpoints/finetune_all
tensorboard: logs/finetune_all
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

# LoRA configuration
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: true
  r: 32
  alpha: 32
  dropout: 0.05

# Distribution options (optional)
# - If distribute=false (default): save pretrained_path as base_model in lora_config.json
# - If distribute=true: save hf_model_id as base_model (hf_model_id is required)
# hf_model_id: "openbmb/VoxCPM2"
# distribute: true
