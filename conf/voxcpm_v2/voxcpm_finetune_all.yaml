pretrained_path: ckpt/base_nv/
train_manifest: dataset/train.jsonl
val_manifest: null
sample_rate: 16000        # AudioVAE encoder input rate; must match audio_vae_config.sample_rate
out_sample_rate: 48000    # AudioVAE decoder output rate; used for TensorBoard audio logging
batch_size: 1
grad_accum_steps: 16  # effective batch size = batch_size × grad_accum_steps = 16
num_workers: 0
num_iters: 50000
log_interval: 1
valid_interval: 1000
save_interval: 1000
learning_rate: 0.00001
weight_decay: 0.01
warmup_steps: 100
max_steps: 50000
max_batch_tokens: 4096
max_grad_norm: 1.0        # gradient clipping max norm; 0 = disabled
save_path: checkpoints/finetune_all
tensorboard: logs/finetune_all
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
